name: CI

# Fast breakage check on every PR: build the frontend and check/test/lint the
# Rust backend. No app bundling here — that lives in release.yml.
#
# Two deliberate omissions, both because the free Actions allowance is metered
# in quota-minutes = wall-clock x runner multiplier (macOS 10x, Windows 2x):
#
#   * No push-to-main trigger. main is only reached by merging a PR that already
#     passed this matrix, so it just re-ran an identical check.
#   * No macos-latest leg. Development happens on macOS and scripts/ci-local.sh
#     runs these exact steps there via the pre-push hook, so a hosted Mac would
#     re-run what already passed locally — at 30 of the 48 quota-minutes a
#     3-OS run costs. release.yml still builds and bundles macOS on every tag,
#     so macOS packaging is verified before anything ships.
#
# What's left is the two platforms a Mac laptop genuinely cannot check. If the
# dev platform ever changes, revisit which leg is the redundant one.

on:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend (tsc + vite)
        run: npm run build

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      # Fatal, matching scripts/ci-local.sh. The pre-existing warnings were
      # cleared in #91, so a new one is now a real signal.
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
