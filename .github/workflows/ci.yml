name: CI

# Build the frontend and check/test/lint the Rust backend. No app bundling —
# that lives in release.yml.
#
# This file used to be shaped by the free tier's 2,000 quota-minute cap: no
# push trigger, no macOS leg, no runs on Dependabot's PRs. The repo is public
# now, so standard runners are free and unmetered, and every one of those
# omissions was costing verification to save money that is no longer spent.
# What is here now is what the project actually needs checked.

on:
  pull_request:
  # main is reached by local merges, not only by PRs, and a merge of two green
  # branches is not itself green — two real bugs have shipped here that existed
  # only in the combination. CI never saw them because it only ever tested the
  # branches. This trigger is what closes that gap.
  push:
    branches: [main]
  workflow_dispatch:

# Superseded commits do not need finishing; this is about feedback latency, not
# cost.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is the development and primary release target and was the one
        # platform with no hosted check at all — scripts/ci-local.sh in the
        # pre-push hook stood in for it. That hook runs whatever toolchain the
        # Mac happens to have, and on 2026-08-22 that was Rust 1.96 while CI
        # resolved 1.98: the hook passed, main was red, and nobody knew until a
        # dependency PR ran. A hosted leg removes that single point of failure.
        platform: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend (tsc + vite)
        run: npm run build

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      # Fatal, matching scripts/ci-local.sh. The pre-existing warnings were
      # cleared in #91, so a new one is now a real signal.
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
