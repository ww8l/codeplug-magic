[package]
name = "ww8l-codeplug-magic"
version = "26.8.18"
description = "WW8L Codeplug Magic - master codeplug database for amateur radio operators"
authors = ["WW8L"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ww8l_codeplug_magic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
    "migrate",
    "macros",
] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
thiserror = "2"
serialport = "4"
reqwest = { version = "0.12", features = ["json"] }
# Icom `.icf` files carry an MD5 over their own contents (`#CD=`); the radio
# rejects a file whose digest does not match. Already in the tree as a
# transitive dependency, so naming it here adds no new code to the build.
md-5 = "0.10"
