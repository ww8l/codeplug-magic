# `cargo audit` configuration.
#
# cargo-audit is not wired into CI on purpose: GitHub Actions minutes are
# metered here and Dependabot already watches the cargo ecosystem for free
# (.github/dependabot.yml). This file exists so that a developer running
# `cargo audit` by hand gets a clean result plus the reasoning, rather than
# three findings they have to re-investigate every time.
#
# Every entry below was traced to a dependency path before being ignored.
# Re-check an entry whenever Tauri or sqlx is upgraded.

[advisories]
ignore = [
    # quick-xml 0.39.4, reached only as tauri -> plist -> quick-xml.
    # Both advisories are denial-of-service on a parser fed hostile XML:
    # unbounded namespace-declaration allocation, and quadratic time checking
    # a start tag for duplicate attributes. This app never parses XML from an
    # untrusted source — `plist` is used by Tauri for macOS bundle metadata,
    # which is generated at build time from our own tauri.conf.json.
    # The fix needs quick-xml >= 0.41, which requires plist (and therefore
    # Tauri) to bump; nothing we can do from here. Drop these two ignores once
    # a Tauri release carries plist with quick-xml >= 0.41.
    "RUSTSEC-2026-0195",
    "RUSTSEC-2026-0194",

    # rsa 0.9.10 — Marvin Attack, a timing sidechannel with NO patched version.
    # It is NOT in this build's dependency graph: `cargo tree -i rsa` reports
    # "nothing to print". It appears only in Cargo.lock because sqlx lists it
    # for the MySQL backend, and we take sqlx with default-features = false and
    # the sqlite feature only. No RSA code is compiled into the app.
    # If a MySQL/Postgres sqlx feature is ever enabled, DELETE this ignore and
    # re-evaluate — the advisory has no fix.
    "RUSTSEC-2023-0071",
]
